<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>RUCP Attendance QR Code</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				background: white;
			}

			img {
				display: block;
				width: min(100vw, 100vh, 740px);
				width: min(100vw, 100dvh, 740px);
				height: auto;
				image-rendering: pixelated;
			}
		</style>
	</head>
	<body>
		<a href="https://rucp.org/attendance">
			<img
				src="attendance.png"
				width="200"
				height="200"
				alt="RUCP attendance QR code"
			/>
		</a>
	</body>
</html>
